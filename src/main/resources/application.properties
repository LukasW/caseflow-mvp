# Application
quarkus.application.name=caseflow

# Quinoa - Angular SPA integration
quarkus.quinoa.ui-dir=src/main/webapp
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=22.22.3
quarkus.quinoa.package-manager-install.npm-version=11.6.1
quarkus.quinoa.build-dir=dist/caseflow/browser
quarkus.quinoa.dev-server.port=4200
quarkus.quinoa.dev-server.check-path=/index.html
quarkus.quinoa.dev-server.check-timeout=60000
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.ignored-path-prefixes=/api,/q,/docs
quarkus.quinoa.package-manager=npm

# HTTP auth — named policy für /docs (gilt in keycloak- und prod-Profil)
quarkus.http.auth.policy.staff.roles-allowed=CASE_MANAGER,TEAM_LEAD,ADMIN,AUDITOR

# HTTP
quarkus.http.port=8080
# OIDC session cookies grow large with Keycloak realm roles; raise the header limit
# so the Vert.x parser does not return HTTP 431 right after the login callback.
quarkus.http.limits.max-header-size=32K

# Database - PostgreSQL
# Dev Services auto-starts a PostgreSQL container for dev and test.
# In prod, the URL is provided via DB_URL env var (see %prod block).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:16
# Dev Services Container über Test-Runs hinweg wiederverwenden — spart 30–60 s
# pro Quarkus-Test-Boot. Greift nur, wenn ~/.testcontainers.properties
# testcontainers.reuse.enable=true setzt (Dev-Maschine-Opt-in).
quarkus.datasource.devservices.reuse=true

# Hibernate ORM
# Liquibase manages the schema; Hibernate only validates it matches the entities.
quarkus.hibernate-orm.schema-management.strategy=validate
# JSONB columns use Hibernate's own default JSON mapper instead of the REST-layer
# ObjectMapper. Decouples database serialization from REST tuning.
quarkus.hibernate-orm.mapping.format.global=ignore

# Liquibase
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changeLog.xml

# OIDC - disabled by default (enabled via %keycloak or %prod profile)
quarkus.oidc.enabled=false

# Jackson - REST DTOs serialize to snake_case
quarkus.jackson.property-naming-strategy=SNAKE_CASE

# OpenAPI / SwaggerUI
quarkus.smallrye-openapi.info-title=CaseFlow API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=REST-API des Case-Management-Tools CaseFlow.
quarkus.swagger-ui.always-include=true
# The OpenAPI scanner does not pick up quarkus.jackson.property-naming-strategy,
# so the schema needs the same snake_case strategy configured explicitly.
mp.openapi.extensions.smallrye.property-naming-strategy=com.fasterxml.jackson.databind.PropertyNamingStrategies$SnakeCaseStrategy

# Health
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-health.liveness-path=live
quarkus.smallrye-health.readiness-path=ready

# HTTP Security Headers
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."Referrer-Policy".value=strict-origin-when-cross-origin
quarkus.http.header."Permissions-Policy".value=geolocation=(), microphone=(), camera=()
%prod.quarkus.http.header."Strict-Transport-Security".value=max-age=31536000; includeSubDomains
%prod.quarkus.http.header."Content-Security-Policy".value=default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'

# Logging
quarkus.log.level=INFO
quarkus.log.category."ch.css.demo.caseflow".level=INFO

# ==============================================================================
# Test profile
# Dev Services starts a dedicated PostgreSQL container automatically.
# ==============================================================================
%test.quarkus.http.test-port=0
%test.quarkus.oidc.enabled=false
%test.quarkus.quinoa.dev-server.managed=false
%test.quarkus.quinoa.just-build=false

# ==============================================================================
# Dev profile
# Dev Services starts a shared PostgreSQL container automatically.
# ==============================================================================
%dev.quarkus.oidc.enabled=false
%dev.quarkus.quinoa.package-manager-command.dev=run start -- -c quarkus
# Ersatzidentität für GET /api/v1/me, solange OIDC deaktiviert ist.
%dev.caseflow.auth.dev-user=dev
%dev.caseflow.auth.dev-role=CASE_MANAGER

# ==============================================================================
# Keycloak profile (activate with -Dquarkus.profile=dev,keycloak)
# ==============================================================================
%keycloak.quarkus.oidc.enabled=true
%keycloak.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/caseflow}
%keycloak.quarkus.oidc.client-id=${OIDC_CLIENT_ID:caseflow}
%keycloak.quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:dev-secret}
%keycloak.quarkus.oidc.application-type=web-app
%keycloak.quarkus.oidc.authentication.cookie-suffix=caseflow
%keycloak.quarkus.oidc.authentication.cookie-path=/
%keycloak.quarkus.oidc.authentication.session-age-extension=8h
%keycloak.quarkus.oidc.authentication.cookie-same-site=lax
%keycloak.quarkus.oidc.authentication.redirect-path=/
%keycloak.quarkus.oidc.authentication.pkce-required=true
%keycloak.quarkus.oidc.authentication.java-script-auto-redirect=false
%keycloak.quarkus.http.auth.permission.authenticated.paths=/api/*,/logout
%keycloak.quarkus.http.auth.permission.authenticated.policy=authenticated
%keycloak.quarkus.http.auth.permission.public.paths=/q/health/*,/q/oidc/*,/q/swagger-ui/*,/q/openapi
%keycloak.quarkus.http.auth.permission.public.policy=permit
%keycloak.quarkus.http.auth.permission.docs.paths=/docs,/docs/*
%keycloak.quarkus.http.auth.permission.docs.policy=staff
%keycloak.quarkus.quinoa.package-manager-command.dev=run start -- -c keycloak
# CaseFlow-Rollen sind Client-Rollen des caseflow-Clients; RoleMappingAugmentor
# bildet die Keycloak-Namen (caseflow-case-manager, …) auf die internen Roles ab
%keycloak.quarkus.oidc.roles.role-claim-path=resource_access/caseflow/roles
%keycloak.quarkus.oidc.roles.source=accesstoken
%keycloak.quarkus.oidc.token.refresh-expired=true
%keycloak.quarkus.oidc.token-state-manager.encryption-secret=${OIDC_SESSION_ENCRYPTION_SECRET:caseflow-session-encryption-secret-key}
# RP-initiated Logout: aktiviert /logout. Quarkus OIDC matcht diesen
# virtuellen Pfad nur, wenn er von einer authenticated-Policy abgedeckt ist
# (sonst greift der Filter nicht und Quarkus liefert 404). post-logout-path
# leitet nach erfolgreichem Keycloak-Logout zurück auf die Startseite — die
# absolute URL muss in den "Valid post logout redirect URIs" des Keycloak-
# Clients caseflow eingetragen sein.
%keycloak.quarkus.oidc.logout.path=/logout
%keycloak.quarkus.oidc.logout.post-logout-path=/

# ==============================================================================
# Explicit PostgreSQL profile (activate with -Dquarkus.profile=dev,postgres)
# Bypasses Dev Services and connects to a specific local PostgreSQL instance.
# ==============================================================================
%postgres.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5434/caseflow}
%postgres.quarkus.datasource.username=${DB_USERNAME:caseflow}
%postgres.quarkus.datasource.password=${DB_PASSWORD:caseflow}

# ==============================================================================
# Production profile
# ==============================================================================
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.oidc.enabled=true
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
%prod.quarkus.oidc.client-id=${OIDC_CLIENT_ID}
%prod.quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET}
%prod.quarkus.oidc.application-type=web-app
%prod.quarkus.oidc.authentication.cookie-suffix=caseflow
%prod.quarkus.oidc.authentication.cookie-path=/
%prod.quarkus.oidc.authentication.session-age-extension=8h
%prod.quarkus.oidc.authentication.cookie-same-site=lax
%prod.quarkus.oidc.authentication.redirect-path=/
%prod.quarkus.oidc.authentication.pkce-required=true
%prod.quarkus.oidc.authentication.java-script-auto-redirect=false
%prod.quarkus.oidc.roles.role-claim-path=resource_access/caseflow/roles
%prod.quarkus.oidc.roles.source=accesstoken
%prod.quarkus.oidc.token.refresh-expired=true
%prod.quarkus.oidc.token-state-manager.encryption-secret=${OIDC_SESSION_ENCRYPTION_SECRET}
%prod.quarkus.oidc.logout.path=/logout
%prod.quarkus.oidc.logout.post-logout-path=/
%prod.quarkus.http.auth.permission.authenticated.paths=/api/*,/logout
%prod.quarkus.http.auth.permission.authenticated.policy=authenticated
%prod.quarkus.http.auth.permission.public.paths=/q/health/*,/q/oidc/*,/q/swagger-ui/*,/q/openapi
%prod.quarkus.http.auth.permission.public.policy=permit
%prod.quarkus.http.auth.permission.docs.paths=/docs,/docs/*
%prod.quarkus.http.auth.permission.docs.policy=staff

# Build-Informationen: via -Dcaseflow.build.timestamp / -Dcaseflow.build.git-commit im Release-Build gesetzt
caseflow.build.timestamp=@caseflow.build.timestamp@
caseflow.build.git-commit=@caseflow.build.git-commit@
%dev.caseflow.build.timestamp=dev
%dev.caseflow.build.git-commit=local
