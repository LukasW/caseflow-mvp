name: CI

# Build + Tests inkl. der Dev-Services-Integrationstests (Testcontainers).
# Läuft auf GitHub-hosted Runnern; für einen self-hosted ARC-Runner
# `runs-on` auf den RunnerScaleSet-Namen umstellen.
on:
  pull_request:
  push:
    branches: [main]

# Pro Branch nur ein Lauf gleichzeitig.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: MkDocs build (Systemdokumentation)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv run --with mkdocs-material mkdocs build

      - name: mvn verify
        run: ./mvnw -B -ntp verify

      - name: Cucumber-Bericht hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-html-reports
          path: target/cucumber-html-reports/
          retention-days: 30
